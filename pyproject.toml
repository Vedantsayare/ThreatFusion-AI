[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threatfusion-ai"
version = "0.1.0"
description = "Agentic SOC copilot with temporal knowledge-graph memory"
requires-python = ">=3.12"
readme = "README.md"

# ─────────────────────────────────────────────────────────────────────────────
#  Runtime dependencies are pinned to minimum compatible versions only.
#  Lock file (requirements.txt) generated from `pip-compile` provides exact pins.
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Configuration & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # PostgreSQL async
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",

    # Neo4j
    "neo4j>=5.20.0",

    # Redis
    "redis[hiredis]>=5.0.0",

    # HTTP client (Wazuh, MISP)
    "httpx>=0.27.0",

    # LangGraph / orchestration  — installed but not wired until Phase 7
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",

    # Structured logging
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ─────────────────────────────────────────────────────────────────────────────
#  Explicit package discovery.
#  Without this, setuptools in flat-layout mode refuses to build when it
#  detects multiple top-level Python directories.
#  dashboard/ is a React app (not a Python package) — excluded.
#  tests/, docs/, scripts/ are dev-only — excluded from the installed package.
# ─────────────────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
include = [
    "agents*",
    "api*",
    "core*",
    "graph*",
    "ingestion*",
    "normalization*",
    "orchestrator*",
    "simulation*",
]
exclude = ["dashboard*", "tests*", "docs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Never treat a skipped test as a pass — each skip must have an explicit reason.
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require live Docker services (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT"]
ignore = ["E501", "UP042"]  # E501 handled by formatter; UP042 StrEnum needs careful migration

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
